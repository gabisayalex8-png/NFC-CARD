<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC CARD</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
}

.card {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    padding: 50px 25px;
    text-align: center;
    background: linear-gradient(180deg, #111 0%, #050505 100%);
}

.profile {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #222;
    border: 2px solid #d4af37;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #d4af37;
    font-size: 14px;
}

h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.button {
    display: block;
    padding: 17px;
    border: 1px solid #d4af37;
    border-radius: 12px;
    color: white;
    text-decoration: none;
    font-size: 16px;
    background: #111;
}

.button:hover {
    background: #d4af37;
    color: #000;
}

.footer {
    margin-top: 35px;
    color: #777;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="card">

    <div class="profile">
        PROFILE
    </div>

    <h1 id="name">NFC CARD</h1>

    <p class="subtitle" id="subtitle">
        Connect with me
    </p>

    <div class="buttons">

        <a class="button" id="facebook" href="#" target="_blank">
            Facebook
        </a>

        <a class="button" id="instagram" href="#" target="_blank">
            Instagram
        </a>

        <a class="button" id="tiktok" href="#" target="_blank">
            TikTok
        </a>

        <a class="button" id="messenger" href="#" target="_blank">
            Messenger
        </a>

        <a class="button" id="phone" href="#">
            Contact Me
        </a>

    </div>

    <div class="footer">
        NFC DIGITAL BUSINESS CARD
    </div>

</div>

<script>
fetch("data.json")
.then(response => response.json())
.then(data => {

    document.getElementById("name").textContent =
        data.name || "NFC CARD";

    document.getElementById("subtitle").textContent =
        data.subtitle || "Connect with me";

    if (data.facebook) {
        document.getElementById("facebook").href = data.facebook;
    }

    if (data.instagram) {
        document.getElementById("instagram").href = data.instagram;
    }

    if (data.tiktok) {
        document.getElementById("tiktok").href = data.tiktok;
    }

    if (data.messenger) {
        document.getElementById("messenger").href = data.messenger;
    }

    if (data.phone) {
        document.getElementById("phone").href =
            "tel:" + data.phone;
    }

})
.catch(error => {
    console.log("Data loading error:", error);
});
</script>

</body>
</html>
