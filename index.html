<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC CARD</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
}

.card {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    padding: 50px 25px;
    text-align: center;
    background: linear-gradient(180deg, #111 0%, #050505 100%);
}

.profile {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #222;
    border: 2px solid #d4af37;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #d4af37;
    font-size: 14px;
}

h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.button {
    display: block;
    padding: 17px;
    border: 1px solid #d4af37;
    border-radius: 12px;
    color: white;
    text-decoration: none;
    font-size: 16px;
    background: #111;
}

.button:hover {
    background: #d4af37;
    color: #000;
}

.footer {
    margin-top: 35px;
    color: #777;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="card">

    <div class="profile">
        PROFILE
    </div>

    <h1>NFC CARD</h1>

    <p class="subtitle">
        Connect with me
    </p>

    <div class="buttons">

        <a class="button" href="#" target="_blank">
            Facebook
        </a>

        <a class="button" href="#" target="_blank">
            Instagram
        </a>

        <a class="button" href="#" target="_blank">
            TikTok
        </a>

        <a class="button" href="#" target="_blank">
            Messenger
        </a>

        <a class="button" href="tel:+630000000000">
            Contact Me
        </a>

    </div>

    <div class="footer">
        NFC DIGITAL BUSINESS CARD
    </div>

</div>

</body>
</html>
